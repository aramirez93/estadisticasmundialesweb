name: Actualizar datos
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Datos del FMI
        run: node .github/scripts/actualizar_imf.mjs
        continue-on-error: true
      - name: Datos de la OMS, la OIT y Our World in Data
        run: node .github/scripts/actualizar_ext.mjs
        continue-on-error: true
      - name: Datos por regiones (Europa, EE. UU., Canadá, Brasil, Colombia, México)
        run: node .github/scripts/actualizar_reg.mjs
        continue-on-error: true
      - name: Guardar cambios
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || (git commit -m "Actualizar datos" && git push)
